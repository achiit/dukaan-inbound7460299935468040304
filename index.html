<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal profile">
  <title>My Profile</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#292929,#080808 50%,#000);padding:30px 15px}
    .profile{width:100%;max-width:460px;margin:auto;text-align:center}
    .photo{width:105px;height:105px;margin:10px auto 18px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 30px rgba(255,255,255,.15)}
    .photo img{width:100%;height:100%;object-fit:cover}
    h1{font-size:28px;margin-bottom:7px}
    .username{color:#888;font-size:14px;margin-bottom:15px}
    .bio{color:#bbb;font-size:14px;line-height:1.6}
    .links{margin-top:28px}
    .link{display:block;width:100%;padding:16px 20px;margin-bottom:13px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:14px;font-weight:bold;transition:.2s}
    .link:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
    .share{width:100%;padding:14px;margin-top:8px;border:1px solid #333;border-radius:12px;background:#111;color:#fff;font-weight:bold;cursor:pointer}
    footer{margin-top:25px;color:#555;font-size:11px}
  </style>
</head>
<body>
  <main class="profile">
    <div class="photo"><img id="photo" alt="Profile photo"></div>
    <h1 id="name">Loading...</h1>
    <div class="username" id="username"></div>
    <p class="bio" id="bio"></p>
    <div class="links" id="links"></div>
    <button class="share" onclick="shareProfile()">🔗 Share My Profile</button>
    <footer>© <span id="year"></span></footer>
  </main>

  <script>
    async function loadProfile() {
      const res = await fetch("/api/profile");
      const p = await res.json();

      document.title = p.name + " — Profile";
      document.getElementById("name").textContent = p.name;
      document.getElementById("username").textContent = "@" + p.username;
      document.getElementById("bio").textContent = p.bio;
      document.getElementById("photo").src = p.photo || "https://i.pravatar.cc/300";
      document.getElementById("year").textContent = new Date().getFullYear();

      const links = document.getElementById("links");
      links.innerHTML = "";

      p.links.forEach(link => {
        const a = document.createElement("a");
        a.className = "link";
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "🔗 " + link.name;
        links.appendChild(a);
      });
    }

    async function shareProfile() {
      const url = location.href;
      if (navigator.share) {
        await navigator.share({
          title: document.title,
          text: "Check out my profile",
          url
        });
      } else {
        await navigator.clipboard.writeText(url);
        alert("Profile link copied!");
      }
    }

    loadProfile().catch(() => {
      document.getElementById("name").textContent = "Profile unavailable";
    });
  </script>
</body>
</html>
